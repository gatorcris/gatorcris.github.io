<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1b2a" />
  <title>GatorCris | Connect</title>
  <style>
    :root {
      --navy:#0d1b2a; --navy2:#12243a; --gold:#c8a96a; --paper:#f7f4ec; --muted:#b9c0c8; --white:#ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--navy); color:var(--white); }
    body { display:flex; justify-content:center; padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
    .card { width:100%; max-width:480px; }
    .hero { border:1px solid rgba(200,169,106,.45); border-radius:28px; padding:28px 22px 22px; background:linear-gradient(160deg,var(--navy2),#09131f 62%); box-shadow:0 18px 48px rgba(0,0,0,.35); text-align:center; }
    .eyebrow { color:var(--gold); font-size:13px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin-bottom:14px; }
    h1 { margin:0; font-size:42px; line-height:1; letter-spacing:-.03em; }
    .sub { margin:12px 0 0; color:#e7eaee; font-size:18px; line-height:1.35; font-weight:600; }
    .small { margin:8px 0 0; color:var(--muted); font-size:15px; line-height:1.35; }
    .buttons { display:grid; gap:12px; margin-top:18px; }
    a.button { display:flex; align-items:center; justify-content:center; min-height:58px; border-radius:18px; text-decoration:none; font-weight:800; font-size:17px; letter-spacing:.01em; padding:14px 16px; }
    .primary { background:var(--gold); color:#111; box-shadow:0 8px 22px rgba(200,169,106,.25); }
    .secondary { background:rgba(255,255,255,.08); color:var(--white); border:1px solid rgba(255,255,255,.14); }
    .light { background:var(--paper); color:#152237; }
    .footer { text-align:center; color:var(--muted); font-size:12px; line-height:1.5; margin:16px 8px 0; }
    .footer a { color:var(--muted); }
    @media (max-width:360px) { h1 { font-size:36px; } .sub {font-size:16px} a.button { min-height:54px; font-size:16px; } }
  </style>
</head>
<body>
  <main class="card">
    <section class="hero">
      <div class="eyebrow">Watch Content Creator</div>
      <h1>GatorCris</h1>
      <p class="sub">Microbrands · Independents · European Design</p>
      <p class="small">TikTok · WatchCrunch · YouTube</p>
      <div class="buttons">
        <a class="button primary" href="GatorCris.vcf">Save Cris to Contacts</a>
        <a class="button secondary" href="https://www.tiktok.com/@gatorcris">TikTok @GatorCris</a>
        <a class="button secondary" href="https://www.watchcrunch.com/GatorCris">WatchCrunch</a>
        <a class="button secondary" href="https://www.youtube.com/@gatorcriswatches">YouTube</a>
        <a class="button light" href="mailto:bjelajac.cristopher@gmail.com">Email Cris</a>
        <a class="button secondary" href="https://wa.me/393333668017">WhatsApp</a>
        <a class="button secondary" href="https://gatorcris.github.io/GatorCris_MediaKit_2026.pdf">View Media Kit</a>
      </div>
    </section>
    
    <p class="footer">Cris Bjelajac · Massachusetts, USA<br><a href="https://gatorcris.github.io/">gatorcris.github.io</a></p>
  </main>
</body>
</html>
